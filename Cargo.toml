[package]
name = "peckboard-session-control-plugin"
version = "0.4.1"
edition = "2024"
description = "Control and orchestrate Peckboard sessions: interrupt, terminate, clear, send messages/images, plus goal-driven orchestrators that schedule, watch, and direct other sessions autonomously."
repository = "https://github.com/PeckBoard/session-control"
license = "MIT"
publish = false

[lib]
# Extism loads plugins as WASM cdylibs. The compiled artifact is
# `target/wasm32-unknown-unknown/release/peckboard_session_control_plugin.wasm`.
crate-type = ["cdylib"]

[dependencies]
# Extism Plugin Development Kit. Must stay major-version compatible with the
# host runtime Peckboard embeds (extism 1.x — see peckboard/Cargo.toml).
extism-pdk = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Time parsing/arithmetic only — no "clock" feature: wasm32-unknown-unknown has
# no time source, so "now" always comes from host payloads (timer.tick).
chrono = { version = "0.4", default-features = false, features = ["std", "alloc", "serde"] }

[profile.release]
# Smaller, self-contained wasm: strip and optimize for size.
opt-level = "s"
lto = true
strip = true
