[package]
name = "peckboard-session-control-plugin"
version = "0.3.0"
edition = "2024"
description = "Control another Peckboard session: interrupt, terminate, clear, send messages/images. Same-folder free; cross-folder asks Approve once/always."
repository = "https://github.com/PeckBoard/session-control"
license = "MIT"
publish = false

[lib]
# Extism loads plugins as WASM cdylibs. The compiled artifact is
# `target/wasm32-unknown-unknown/release/peckboard_session_control_plugin.wasm`.
crate-type = ["cdylib"]

[dependencies]
# Extism Plugin Development Kit. Must stay major-version compatible with the
# host runtime Peckboard embeds (extism 1.x — see peckboard/Cargo.toml).
extism-pdk = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Smaller, self-contained wasm: strip and optimize for size.
opt-level = "s"
lto = true
strip = true
